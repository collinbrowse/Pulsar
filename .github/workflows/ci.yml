name: CI - Build and Test

on:
  push:
    branches: [ main, 'milestone-*', 'cursor/*' ]
  pull_request:
    branches: [ main ]

env:
  XCODE_VERSION: '26.0'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: List available simulators
      run: xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20
      
    - name: Get simulator ID
      id: simulator
      run: |
        # Get the first iPhone 16 Pro simulator ID
        SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 16 Pro" | head -1 | sed 's/.*(\([A-F0-9-]*\)).*/\1/')
        echo "id=$SIMULATOR_ID" >> $GITHUB_OUTPUT
        echo "Using simulator: $SIMULATOR_ID"
      
    - name: Restore SPM cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build app
      run: |
        xcodebuild clean build \
          -project Pulsar.xcodeproj \
          -scheme Pulsar \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: false
      
    - name: Run unit tests
      run: |
        xcodebuild test \
          -project Pulsar.xcodeproj \
          -scheme PulsarTests \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: false
      
    - name: Run UI tests
      run: |
        xcodebuild test \
          -project Pulsar.xcodeproj \
          -scheme PulsarUITests \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: true
      
    - name: Generate code coverage report
      if: success()
      run: |
        xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json || true
        
    - name: Upload coverage reports
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.json
        fail_ci_if_error: false
        
  lint:
    name: Lint Swift Code
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging
      continue-on-error: true
      
  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for secrets
      run: |
        if grep -r "sk_live_\|pk_live_\|ghp_\|gho_" --include="*.swift" --exclude-dir=".git" .; then
          echo "ERROR: Hardcoded secrets found!"
          exit 1
        fi
        echo "✓ No hardcoded secrets detected"

