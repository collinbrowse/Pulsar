name: CI - Build and Test

on:
  push:
    branches: [ main, 'milestone-*', 'cursor/*' ]
  pull_request:
    branches: [ main ]

# Note: This project is designed for iOS 26+ and requires Xcode 26 with iOS SDK.
# Since iOS 26 SDK isn't installed on GitHub Actions runners yet, we run
# lint and security checks only. Full build/test requires local Xcode 26.

jobs:
  lint:
    name: Lint Swift Code
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging
      continue-on-error: true  # Allow warnings
      
  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for secrets
      run: |
        # Check for hardcoded API keys
        if grep -r "sk_live_\|pk_live_\|ghp_\|gho_" --include="*.swift" --exclude-dir=".git" .; then
          echo "ERROR: Hardcoded secrets found!"
          exit 1
        fi
        echo "✓ No hardcoded secrets detected"
        
    - name: Verify no sensitive files
      run: |
        if [ -f ".env.local" ] || [ -f ".env" ]; then
          echo "ERROR: Environment files should not be committed!"
          exit 1
        fi
        echo "✓ No sensitive files found"
        
  code-structure:
    name: Verify Code Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Swift file count
      run: |
        SWIFT_COUNT=$(find . -name "*.swift" -not -path "./.build/*" | wc -l)
        echo "Total Swift files: $SWIFT_COUNT"
        if [ "$SWIFT_COUNT" -lt 20 ]; then
          echo "WARNING: Expected at least 20 Swift files"
        fi
        
    - name: Verify test directories
      run: |
        if [ -d "PulsarTests" ] && [ -d "PulsarUITests" ]; then
          echo "✓ Test directories exist"
          UNIT_TESTS=$(find PulsarTests -name "*.swift" | wc -l)
          UI_TESTS=$(find PulsarUITests -name "*.swift" | wc -l)
          echo "Unit test files: $UNIT_TESTS"
          echo "UI test files: $UI_TESTS"
        else
          echo "ERROR: Test directories not found"
          exit 1
        fi
        
    - name: Verify project structure
      run: |
        for dir in "Pulsar/App" "Pulsar/Features" "Pulsar/Shared"; do
          if [ -d "$dir" ]; then
            echo "✓ $dir exists"
          else
            echo "ERROR: $dir not found"
            exit 1
          fi
        done
        
    - name: Verify documentation
      run: |
        for file in "README.md" "docs/README.md" "docs/API.md"; do
          if [ -f "$file" ]; then
            echo "✓ $file exists"
          else
            echo "WARNING: $file not found"
          fi
        done

