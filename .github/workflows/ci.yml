name: CI - Build and Test

on:
  push:
    branches: [ main, 'milestone-*', 'cursor/*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Note: Full build requires Xcode 26+ which isn't available on GitHub Actions yet
  # This workflow runs available checks (lint, security) until Xcode 26 is released
  
  lint:
    name: Lint Swift Code
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging
      continue-on-error: true  # Allow warnings, fail only on errors
      
  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for secrets
      run: |
        # Check for hardcoded API keys (but allow JWT tokens in Environment.swift)
        if grep -r "sk_live_\|pk_live_\|ghp_\|gho_" --include="*.swift" --exclude-dir=".git" .; then
          echo "ERROR: Hardcoded secrets found!"
          exit 1
        fi
        echo "✓ No hardcoded secrets detected"
        
    - name: Verify no sensitive files
      run: |
        # Check that sensitive files are not committed
        if [ -f ".env.local" ] || [ -f ".env" ]; then
          echo "ERROR: Environment files should not be committed!"
          exit 1
        fi
        echo "✓ No sensitive files found"
        
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Swift file count
      run: |
        SWIFT_COUNT=$(find . -name "*.swift" -not -path "./.build/*" | wc -l)
        echo "Swift files: $SWIFT_COUNT"
        
    - name: Check test coverage files exist
      run: |
        if [ -d "PulsarTests" ] && [ -d "PulsarUITests" ]; then
          echo "✓ Test directories exist"
          TEST_COUNT=$(find PulsarTests PulsarUITests -name "*.swift" | wc -l)
          echo "Test files: $TEST_COUNT"
        else
          echo "WARNING: Test directories not found"
          exit 1
        fi
        
    - name: Check documentation exists
      run: |
        if [ -f "README.md" ] && [ -d "docs" ]; then
          echo "✓ Documentation exists"
        else
          echo "WARNING: Documentation incomplete"
        fi
        
    - name: Verify project structure
      run: |
        # Check that key directories exist
        for dir in Pulsar/App Pulsar/Features Pulsar/Shared; do
          if [ -d "$dir" ]; then
            echo "✓ $dir exists"
          else
            echo "ERROR: $dir not found"
            exit 1
          fi
        done

