name: CI - Danger

on:
  pull_request:
    branches: [ main, 'milestone-*' ]

jobs:
  danger:
    name: Danger PR Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install Danger
      run: gem install danger danger-gitlab danger-jira || gem install danger
        
    - name: Run Danger
      env:
        DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bundle exec danger || danger || true


